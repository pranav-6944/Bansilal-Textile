<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist — Bansilal Textile</title>
  <meta name="description" content="Your saved wishlist items at Bansilal Textile. View and manage your favourite handloom sarees, bridal couture, and textiles.">
  <link rel="icon" href="../favicon_io/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="css/bansilal.css">
  <style>
    body { padding-top: 0; }
    .wishlist-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.25rem;
    }
    @media (min-width: 768px) { .wishlist-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1024px) { .wishlist-grid { grid-template-columns: repeat(4, 1fr); } }
  </style>
</head>
<body>
  <div style="height:2.5rem;background:var(--color-tertiary-container);" aria-hidden="true"></div>

  <main style="padding-top:4.5rem;min-height:100vh;background:var(--color-background);">
    <div class="container" style="padding-top:2.5rem;padding-bottom:5rem;">
      <nav class="breadcrumbs" aria-label="Breadcrumb" style="margin-bottom:2rem;">
        <a href="index.html">Home</a>
        <span class="breadcrumbs__sep">›</span>
        <span class="breadcrumbs__current">My Wishlist</span>
      </nav>
      <div style="display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin-bottom:2.5rem;">
        <div>
          <div class="section-label"><span class="section-label__line"></span><span class="section-label__text">Saved Favourites</span></div>
          <h1 style="font-family:var(--font-display);font-size:clamp(1.75rem,4vw,3rem);font-weight:400;color:var(--color-primary);">My Wishlist</h1>
          <p id="wishlist-count" style="font-size:0.875rem;color:var(--color-on-surface-variant);margin-top:0.25rem;"></p>
        </div>
        <div style="display:flex;gap:0.75rem;">
          <button id="add-all-btn" onclick="addAllToCart()" class="btn-primary" style="display:none;">
            <span class="material-symbols-outlined" style="font-size:1rem;">shopping_bag</span>
            Add All to Cart
          </button>
        </div>
      </div>

      <!-- Empty State -->
      <div id="wishlist-empty" class="empty-state" style="display:none;padding:5rem 2rem;min-height:30rem;">
        <div class="empty-state__icon" style="width:5rem;height:5rem;">
          <span class="material-symbols-outlined" style="font-size:2.5rem;">favorite_border</span>
        </div>
        <h2 class="empty-state__title" style="font-size:1.5rem;">Your wishlist is empty</h2>
        <p class="empty-state__text">Browse our collection and save pieces you love. Your wishlist is saved automatically.</p>
        <a href="shop.html" class="btn-primary" style="margin-top:1rem;">Explore Collections</a>
      </div>

      <!-- Wishlist Grid -->
      <div class="wishlist-grid" id="wishlist-grid" style="display:none;"></div>
    </div>
  </main>

  <script src="data/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/layout.js"></script>
  <script>
    function renderWishlist() {
      const ids = wishlistManager.getWishlist();
      const grid = document.getElementById('wishlist-grid');
      const empty = document.getElementById('wishlist-empty');
      const countEl = document.getElementById('wishlist-count');
      const addAllBtn = document.getElementById('add-all-btn');

      countEl.textContent = ids.length + ' saved item' + (ids.length !== 1 ? 's' : '');

      if (ids.length === 0) {
        grid.style.display = 'none';
        empty.style.display = 'flex';
        if (addAllBtn) addAllBtn.style.display = 'none';
        return;
      }

      empty.style.display = 'none';
      grid.style.display = 'grid';
      if (addAllBtn) addAllBtn.style.display = 'inline-flex';

      const products = ids.map(id => PRODUCTS.find(p => p.id === id)).filter(Boolean);
      grid.innerHTML = products.map(p => {
        const discount = getDiscount(p.price, p.compareAtPrice);
        return `
          <article class="product-card" data-product-id="${p.id}">
            <div class="product-card__image-wrap">
              <a href="product.html?slug=${p.slug}">
                <img class="product-card__image" src="${p.images[0]}" alt="${p.name}" loading="lazy">
              </a>
              ${p.newArrival ? '<span class="product-card__badge product-card__badge--new">New</span>' : ''}
              ${discount > 0 && !p.newArrival ? `<span class="product-card__badge product-card__badge--sale">${discount}% Off</span>` : ''}
              <button class="product-card__wishlist is-wished" 
                onclick="removeFromWishlistAndRefresh('${p.id}')"
                aria-label="Remove from wishlist">
                <span class="material-symbols-outlined" style="font-size:16px;font-variation-settings:'FILL' 1">favorite</span>
              </button>
            </div>
            <div class="product-card__body">
              <span class="product-card__category">${p.categoryLabel}</span>
              <h3 class="product-card__name"><a href="product.html?slug=${p.slug}" style="color:inherit;text-decoration:none;">${p.name}</a></h3>
              <p class="product-card__fabric">${p.fabric.split('—')[0].trim()}</p>
              <div class="product-card__price-row">
                <span class="product-card__price">${formatPrice(p.price)}</span>
                ${p.compareAtPrice ? `<span class="product-card__compare-price">${formatPrice(p.compareAtPrice)}</span>` : ''}
              </div>
              <div style="display:flex;gap:0.5rem;margin-top:0.75rem;">
                <button onclick="cartManager.addToCart('${p.id}',1,this);wishlistManager.remove('${p.id}');renderWishlist();" 
                  class="product-card__add-btn" style="opacity:1;transform:none;flex:1;">
                  Move to Cart
                </button>
              </div>
            </div>
          </article>`;
      }).join('');
    }

    function removeFromWishlistAndRefresh(id) {
      wishlistManager.remove(id);
      renderWishlist();
      showToast('Removed from wishlist', 'success');
    }

    function addAllToCart() {
      const ids = wishlistManager.getWishlist();
      ids.forEach(id => cartManager.addToCart(id, 1));
      wishlistManager.getWishlist().forEach(id => wishlistManager.remove(id));
      renderWishlist();
      showToast('All wishlist items moved to cart!', 'success');
    }

    document.addEventListener('wishlist:updated', renderWishlist);
    document.addEventListener('DOMContentLoaded', renderWishlist);
  </script>
</body>
</html>
